name: 提交插件 / Submit Plugin
description: 提交一个 FaustBot 插件到插件市场
title: "[Plugin] "
labels: [plugin-submission]
body:
  - type: markdown
    attributes:
      value: |
        感谢提交插件！请填写以下信息。zip 包内必须包含插件目录（含 `plugin.json`），
        `plugin.json` 中的 `id` 和 `version` 必须与下方填写一致。
        维护者审核后会打上 `approved` 标签，自动化流程将发布插件并更新索引。
  - type: input
    id: plugin_id
    attributes:
      label: 插件 ID (Plugin ID)
      description: "唯一标识，字母/数字开头，可含 - 和 _，最长 64 字符"
      placeholder: my_plugin
    validations:
      required: true
  - type: input
    id: plugin_name
    attributes:
      label: 插件名称 (Name)
      placeholder: My Plugin
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本 (Version)
      description: "形如 1.0.0；更新已有插件时必须高于已发布版本"
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: 作者 (Author)
    validations:
      required: true
  - type: input
    id: zip_url
    attributes:
      label: 插件包下载链接 (Zip URL)
      description: "https 直链，30MB 以内"
      placeholder: https://example.com/my_plugin.zip
    validations:
      required: true
  - type: input
    id: homepage
    attributes:
      label: 主页 (Homepage)
    validations:
      required: false
  - type: input
    id: tags
    attributes:
      label: 标签 (Tags)
      description: 逗号分隔
      placeholder: tool, example
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: 插件描述 (Description)
    validations:
      required: true
