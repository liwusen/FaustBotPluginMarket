name: Publish Plugin

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: publish-plugin
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.label.name == 'approved' && contains(github.event.issue.labels.*.name, 'plugin-submission')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare (parse issue, download & validate zip, repackage)
        id: prepare
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python scripts/publish_plugin.py prepare --index plugins.json --out-dir _publish

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN_NAME: ${{ steps.prepare.outputs.plugin_name }}
        run: |
          gh release create "${{ steps.prepare.outputs.tag }}" \
            "${{ steps.prepare.outputs.asset_path }}" \
            --title "$PLUGIN_NAME v${{ steps.prepare.outputs.version }}" \
            --notes "Published from #${{ github.event.issue.number }}"

      - name: Update plugins.json
        run: |
          python scripts/publish_plugin.py update-index --index plugins.json --out-dir _publish --issue-number "${{ github.event.issue.number }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugins.json
          git commit -m "publish ${{ steps.prepare.outputs.plugin_id }} v${{ steps.prepare.outputs.version }} (#${{ github.event.issue.number }})"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Comment and close issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "✅ 插件已发布: [${{ steps.prepare.outputs.tag }}](https://github.com/${{ github.repository }}/releases/tag/${{ steps.prepare.outputs.tag }})

          安装链接: \`faustbot://syncPlugin?id=${{ steps.prepare.outputs.plugin_id }}\`"
          gh issue close "${{ github.event.issue.number }}" --reason completed

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "❌ 插件发布失败，请查看 [Action 日志](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})，修正后重新添加 \`approved\` 标签。"
          gh issue edit "${{ github.event.issue.number }}" --remove-label approved
